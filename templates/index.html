<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-Gram Studio</title>
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='images/favicon.ico') }}"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Hibur+Mono&display=swap"
      rel="stylesheet"
    />
    <script
      defer
      src="{{ url_for('static', filename='src/script.js') }}"
    ></script>
    <style>
      * {
        font-family:
          "Geist",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      .amharic-text {
        font-family: "Hibur Mono", monospace;
        font-weight: 400;
        font-style: normal;
      }
      .grid-pattern {
        background-size: 36px 36px;
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.5) 1px,
          transparent 1px
        );
      }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-200">
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div class="absolute inset-0 grid-pattern opacity-40"></div>
      <!-- Glowing Fluid Orbs -->
      <div
        class="absolute top-[25%] right-[10%] w-[500px] h-[500px] bg-violet-500/18 rounded-full blur-[150px] animate-blob"
        style="animation-delay: 3s"
      ></div>
      <div
        class="absolute bottom-[-5%] left-[30%] w-[600px] h-[450px] bg-cyan-500/15 rounded-full blur-[160px] animate-blob"
        style="animation-delay: 6s"
      ></div>

      <div
        class="absolute top-[-25%] right-[-10%] w-[500px] h-[500px] bg-violet-500/18 rounded-full blur-[150px] animate-blob"
        style="animation-delay: 3s"
      ></div>
      <div
        class="absolute bottom-[5%] left-[-30%] w-[600px] h-[450px] bg-cyan-500/15 rounded-full blur-[160px] animate-blob"
        style="animation-delay: 6s"
      ></div>
    </div>
    <div class="relative z-10 min-h-screen flex flex-col">
      <header
        class="w-full border-b border-white/8 backdrop-blur-md bg-[#0b0f17]/70 sticky top-0 z-50"
      >
        <nav
          class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <img
              src="{{ url_for('static', filename='images/logo.png') }}"
              class="w-9 h-9 rounded-xl border-2 border-violet-500"
            />
            <!-- <div
              class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-violet-500 flex items-center justify-center shadow-lg shadow-brand-500/20 ring ring-white/20"
            ><span class="font-bold">N</span></div> -->
            <div class="flex flex-col">
              <span class="font-semibold text-[17px] text-white tracking-tight"
                >N-Gram Studio</span
              >

              <span class="text-xs text-slate-400"
                >Next-word prediction made simple</span
              >
            </div>
          </div>
          <div class="flex items-center gap-6">
            <a
              href=""
              class="px-3 py-1 flex items-center gap-2 rounded-xl hover:bg-gray-800 hover:text-gray-50 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-cpu-ai preview-icon"
              >
                <path d="M12 20v2" />
                <path d="M12 2v2" />
                <path d="M16 9v6" />
                <path d="M17 20v2" />
                <path d="M17 2v2" />
                <path d="M2 12h2" />
                <path d="M2 17h2" />
                <path d="M2 7h2" />
                <path d="M20 12h2" />
                <path d="M20 17h2" />
                <path d="M20 7h2" />
                <path d="M7 20v2" />
                <path d="M7 2v2" />
                <path d="M8 13h4" />
                <path d="M8 15v-4a2 2 0 014 0v4" />
                <rect x="4" y="4" width="16" height="16" rx="2" />
              </svg>
              <span class="text-sm">Sequence Generator</span>
            </a>
            <a
              href=""
              class="px-3 py-1 flex items-center gap-2 rounded-xl hover:bg-gray-800 hover:text-gray-50 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-chart-no-axes-combined preview-icon"
              >
                <path d="M12 16v5" />
                <path d="M16 14.639V21" />
                <path d="M20 10.656V21" />
                <path
                  d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"
                />
                <path d="M4 18.463V21" />
                <path d="M8 14.656V21" />
              </svg>
              <span class="text-sm">Evaluation & Perplexity</span>
            </a>
            <a
              href=""
              class="px-3 py-1 flex items-center gap-2 rounded-xl hover:bg-gray-800 hover:text-gray-50 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-archive preview-icon"
              >
                <rect width="20" height="5" x="2" y="3" rx="1" />
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" />
                <path d="M10 12h4" />
              </svg>
              <span class="text-sm">Vocabulary</span>
            </a>
          </div>
        </nav>
      </header>
      <main class="flex flex-col items-center py-8 px-4 lg:py-16 lg:px-12">
        <div class="flex flex-col items-center mx-auto">
          <h1
            class="amharic-text text-4xl md:text-5xl mb-4 mt-8 font-bold tracking-tight text-center"
          >
            ቀጣይ የሚመጣውን ቃል ይመልከቱ
          </h1>
          <p class="mb-8 text-gray-300 font-normal text-center w-120">
            Type or click any word below. N-Gram Studio estimates the most
            natural completions in real time using n-gram patterns.
          </p>
        </div>
        <div
          class="w-240 border border-gray-500/40 rounded-xl divide-y divide-gray-600/50"
        >
          <div
            class="bg-black text-gray-300 px-3 py-2 flex justify-between items-center gap-6 rounded-t-xl"
          >
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-600/90"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-600/90"></span>
                <span class="w-3 h-3 rounded-full bg-emerald-600/90"></span>
              </div>
              <div class="flex items-center gap-2 text-gray-400">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-square-terminal preview-icon"
                >
                  <path d="m7 11 2-2-2-2" />
                  <path d="M11 13h4" />
                  <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                </svg>
                <span class="text-sm">~/word-predictor</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="text-xs"><span id="words-count">0</span> words</div>
              <button
                class="p-2 flex items-center gap-1 bg-gray-800 text-gray-300 rounded-xl cursor-pointer hover:bg-gray-700 transition-colors"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-copy preview-icon"
                >
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                  <path
                    d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                  />
                </svg>
                <span class="text-xs">Copy</span>
              </button>
            </div>
          </div>
          <div class="relative inline-block w-full">
            <textarea
              id="main-input"
              class="relative z-2 bg-transparent amharic-text text-gray-400 w-full px-6 py-8 focus:border-none focus:outline-none"
            ></textarea>
            <textarea
              id="hint-input"
              class="w-full px-6 py-8 absolute top-0 left-0 bg-gray-950 amharic-text text-gray-600 pointer-events-none"
            ></textarea>
          </div>
          <div class="bg-gray-900 p-6 flex-col space-y-4 rounded-b-xl">
            <div id="error-text"></div>
            <div class="flex gap-4 items-center">
              <div class="flex items-center gap-2">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-lightbulb preview-icon text-yellow-400"
                >
                  <path
                    d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"
                  />
                  <path d="M9 18h6" />
                  <path d="M10 22h4" />
                </svg>
                <span class="text-sm">Suggestions</span>
              </div>
              <div
                id="suggestions-container"
                class="flex items-center gap-3 flex-wrap"
              >
                <button
                  class="flex items-center gap-2 text-sm px-3 py-1 bg-gray-800 border border-gray-600 rounded-2xl"
                >
                  <span class="amharic-text">word</span>
                  <span class="text-emerald-400">0.0243</span>
                </button>
              </div>
            </div>
            <div class="flex w-full gap-6">
              <div class="flex flex-col gap-2 flex-1">
                <div class="flex justify-between items-center gap-4">
                  <label for="n-input" class="text-sm">Select value of n</label>
                  <span id="n-value" class="text-sm font-semibold">{{n}}</span>
                </div>
                <input type="range" name="n-input" id="n-input" min="1" max="4" step="1" value="{{n}}" class="w-full">
              </div>
              <div class="flex flex-col gap-2 flex-1">
                <div class="flex justify-between items-center gap-4">
                  <label for="k-input" class="text-sm">Select how many predictions to return</label>
                  <span id="k-value" class="text-sm font-semibold" >10</span>
                </div>
                <input type="range" name="k-input" id="k-input" min="1" max="25" step="1" class="w-full" value="10">
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
